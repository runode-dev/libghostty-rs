[workspace]
# Listed explicitly rather than as a `*` glob: Dependabot, run on a repository
# that vendors this workspace as a path dependency, expands a glob against that
# repository's root instead of this directory and aborts on the crates it finds
# there.
members = ["crates/libghostty-vt", "crates/libghostty-vt-sys"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"
rust-version = "1.96"
version = "0.2.1"

[workspace.dependencies]
libghostty-vt-sys = { path = "crates/libghostty-vt-sys", version = "0.2.1" }
